name: Build Vocabulary Adventure bundle

on:
  push:
    branches: [main]
    paths:
      - 'public/apps/vocabulary-adventure/app.js'
      - 'public/apps/vocabulary-adventure/game/**'
      - '.github/workflows/build-vocabulary-adventure-bundle.yml'

permissions:
  contents: write

jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build static bundle
        working-directory: public/apps/vocabulary-adventure
        run: npx --yes esbuild@0.24.0 app.js --bundle --minify --format=iife --target=es2020 --legal-comments=none --outfile=app.bundle.js
      - name: Commit generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/apps/vocabulary-adventure/app.bundle.js
          if git diff --cached --quiet; then
            echo "Bundle already current."
            exit 0
          fi
          git commit -m "Build Vocabulary Adventure 2.16.1 bundle"
          git push origin HEAD:main
